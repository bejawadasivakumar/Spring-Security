<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<h2>Login</h2>

<form th:action="@{/login}" method="post">

    Username

    <input type="text"
           name="username">

    <br><br>

    Password

    <input type="password"
           name="password">

    <br><br>

    <button type="submit">

        Login

    </button>

</form>

<div th:if="${param.error}">
    Invalid Username or Password
</div>

<div th:if="${param.logout}">
    Logged Out Successfully
</div>

</body>
</html>
